packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  esbuild: true

# Shared dependency versions, referenced from packages with "catalog:".
catalog:
  tsdown: ^0.22.12
  typescript: ^5.7.0
  vitest: ^3.0.0
  vite: ^6.0.0
  "@biomejs/biome": ^2.0.0
  react: ^18.3.1
  react-reconciler: ^0.29.2
  "@types/react": ^18.3.12

minimumReleaseAgeExclude:
  - tsdown@0.22.12
  - verkit@0.1.0
