name: Release

# Versioning only — this workflow never publishes. It keeps a "Version
# Packages" PR in sync with the pending changesets; merging that PR lands the
# version bumps on main, and publish.yml ships them.
#
# The split is deliberate: npm binds a trusted publisher to one workflow file,
# so the job that runs `pnpm publish` has to live in publish.yml and nowhere
# else.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions: {}

jobs:
  version:
    name: Maintain the Version Packages PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bumps to the PR branch
      pull-requests: write # open and update the PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # No `publish:` input: with only `version:` set, the action opens or
      # refreshes the PR and stops there.
      - name: Create or update the Version PR
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
