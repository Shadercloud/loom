# The filename matters, down to the extension. npm binds a trusted publisher to
# one exact workflow file, and the publisher registered on npmjs.com for every
# @loom-dev package names `publish.yaml` — this file was `publish.yml` for the
# 0.2.0 release, and the OIDC token exchange answered 404 for every package.
# Renaming this file breaks publishing until the publisher is updated to match.
name: Publish

# Runs on every push to main and no-ops unless there is something to publish:
# `changeset publish` only pushes versions the registry does not already have,
# so an ordinary commit is a cheap no-op, and a commit carrying the version
# bumps — `pnpm version-packages`, applied locally, see the README — is what
# actually ships.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: publish-${{ github.ref }}

permissions: {}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      # Nothing is written back to the repo: the release marker is the `v*` tag
      # pushed by hand, not per-package tags.
      contents: read
      id-token: write # mint the OIDC token npm exchanges for a publish token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Gate the publish on the same checks the workspace runs locally. `test`
      # covers both sides of the wasm boundary (cargo test + vitest).
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # `pnpm release` builds the release-profile wasm and the JS, then runs
      # `pnpm -r publish` over packages/* — pnpm skips any version the registry
      # already has, so re-running this on an unchanged main is a no-op.
      #
      # Publishing is done by pnpm directly rather than by `changeset publish`:
      # changesets swallows the publish output and reports a bare `E404
      # undefined` per package, which says nothing about why the registry
      # refused. pnpm surfaces npm's own error.
      #
      # No NPM_TOKEN: pnpm 11.6+ performs the OIDC exchange itself (id-token ->
      # short-lived publish token) and attaches provenance automatically. It
      # degrades to a warning rather than an error when OIDC is unavailable
      # ("Skipped OIDC: ..."), then fails later on a 401/E404 — read the log for
      # that warning before assuming the trusted publisher config is wrong.
      - name: Build and publish
        run: pnpm release
