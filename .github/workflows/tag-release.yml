name: Tag Release

# Cutting a GitHub Release is deliberately separate from publishing to npm.
# npm is handled by publish.yaml when the version bumps land on main; pushing a
# `v*` tag afterwards builds the release-profile wasm and publishes the GitHub
# Release with the built artifacts attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release for (e.g. v0.1.0)
        required: true

permissions: {}

jobs:
  github-release:
    name: Build artifacts and publish the release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release, upload assets
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - run: pnpm typecheck
      - run: pnpm test

      # The install above built the wasm with --dev; redo it with --release so
      # the shipped binary is wasm-opt'd, then build the JS on top of it.
      - name: Build release artifacts
        run: |
          pnpm build:native:release
          pnpm build:packages

      - name: Pack the npm tarballs
        run: |
          mkdir -p artifacts
          pnpm -r --filter "./packages/*" exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          tar -czf artifacts/loom-layout-wasm.tar.gz -C packages/layout pkg
          ls -lh artifacts

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            artifacts/*
